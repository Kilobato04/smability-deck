# Sitio estático: no requiere build. Netlify publica la raíz del repo.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # Documento confidencial: que no aparezca en buscadores
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# CSS/JS sin hash en el nombre: siempre revalidar para ver cambios al instante
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
